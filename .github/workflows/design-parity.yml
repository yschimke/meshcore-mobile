name: Design parity artifacts

# Regenerate the design-parity artifacts (candidate bundle + report.html
# triptychs + verdict) on every push to main and publish them to the long-lived
# `design-parity/main` branch, force-updated each run so it always reflects the
# current state of main. This is the interim, hand-rolled version of the
# permanent-artifact-branch pattern that the design-parity Action should own —
# see https://github.com/yschimke/design-parity/issues/56. It mirrors the
# baseline mechanism of compose-ai-tools' `apply` action (its `development-branch`
# input), which already does this for compose-preview baselines.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push the regenerated artifacts to design-parity/main

concurrency:
  # Serialize on the artifact branch; the newest main commit wins.
  group: design-parity-artifacts
  cancel-in-progress: true

jobs:
  artifacts:
    name: Render + publish design-parity artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Dedicated read-only BuildFetch cache token (see settings.gradle.kts):
      # pull task outputs instead of building cold. Read-only, so safe at job
      # scope; ci.yml holds the read-write token and stays the sole cache writer.
      BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN: ${{ secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
    steps:
      - uses: actions/checkout@v7.0.1

      # JDK + Gradle. The Android SDK is preinstalled on ubuntu-latest, and both
      # render backends need it: :meshcore-components has an android target to
      # configure even though its candidates render on CMP desktop (Skiko), and
      # the :app component candidates render on the Android backend outright.
      - uses: ./.github/actions/setup

      # The consumer-facing CLI install (downloads a release, doesn't build from
      # source). Used here to run `bundle pack` ourselves rather than the `apply`
      # action, which renders preview baselines, not design-parity candidates.
      - name: Install compose-preview CLI
        uses: yschimke/compose-ai-tools/.github/actions/install@v0.19.32
        with:
          # Keep the CLI aligned with the Gradle plugin that produced the
          # preview manifest. In particular, current bundle packing translates
          # filename-safe ids back to raw discovery ids before requesting
          # semantics from the daemon.
          version: catalog
          catalog-key: composePreviewPlugin

      # Two bundles, one per module, because the parity subjects no longer live
      # in a single module. The screen entries are :meshcore-components
      # commonMain and render on the CMP desktop (Skiko) backend; the component
      # entries (DeviceSummaryCard, ContactRow/List, BleDeviceList,
      # TcpConnectPanel, BlePermissionPanel) and the Scanner / SavedDevices
      # screens are :app @Previews and render on the Android backend — their
      # composables reach into androidMain (TcpConnectPanel.kt,
      # BleScannerPanel.kt), so they can't be packed off-Android. design-parity
      # takes a comma-separated --candidate-bundles list, so both are merged
      # into one candidate set at run time.
      #
      # Both packs are driven from design-map.json (so this never drifts from
      # it), split on the `code` handle's module prefix.
      #
      # --with-semantics injects each preview's previews/<id>.semantics.json:
      # an a11y tree + resolved fg/bg colours and, since 0.15.8, per-node
      # design tokens (background colour / corner radius / padding,
      # compose-ai-tools#1897/#1901) so design-parity's token / contrast /
      # a11y checks can evaluate instead of reporting "missing from
      # candidate" (#1843/#1845). The desktop daemon emits the
      # compose/semantics sidecar (#1891) and a daemon-start failure
      # degrades gracefully instead of aborting the pack (#1885).
      - name: Render candidate bundles (CMP desktop + Android)
        env:
          # The preview ids contain an em-dash; force a UTF-8 locale.
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          set -euo pipefail
          mkdir -p build/design-parity

          # Fail loudly, and before spending ~20 min rendering, if an entry
          # belongs to neither module — otherwise nothing renders a candidate for
          # it and design-parity reports "no candidate render available" while
          # the job stays green.
          stray="$(jq -r '
            [.components[].code
             | select((startswith("meshcore-components/") or startswith("app/")) | not)]
            | join(", ")' design-map.json)"
          if [ -n "$stray" ]; then
            echo "::error::design-map entries in an unpacked module: $stray" >&2
            exit 1
          fi

          pack() { # <module> <output> <jq-filter-on-.code>
            local module="$1" out="$2" filter="$3"
            mapfile -t IDS < <(
              jq -r ".components[] | select(.code | ${filter}) | .previewId" design-map.json
            )
            if [ "${#IDS[@]}" -eq 0 ]; then
              echo "::error::no design-map entries matched ${module}" >&2
              exit 1
            fi
            local args=()
            for id in "${IDS[@]}"; do args+=(--id "$id"); done
            echo "Packing ${#IDS[@]} preview(s) from :${module} -> ${out}"
            compose-preview bundle pack --module "$module" "${args[@]}" \
              --with-semantics -o "$out" --timeout 900
            # Assert the artifact rather than trusting the exit status: a failed
            # Gradle model query ("Could not query Gradle project model while
            # resolving module ...") has been observed printing the error and
            # still exiting 0, which would sail past `set -e` and leave
            # design-parity reporting "no candidate render available" on a green
            # job — the same silent-degradation shape as the em-dash bug below.
            if [ ! -s "$out" ]; then
              echo "::error::pack of :${module} produced no bundle at ${out}" >&2
              exit 1
            fi
          }

          pack meshcore-components build/design-parity/candidates.bundle.png \
            'startswith("meshcore-components/")'
          pack app build/design-parity/candidates.app.bundle.png \
            'startswith("app/")'

      # Reference images are generated from the design/*.html source of truth
      # (not committed — they'd drift from the HTML). The claude-design adapter's
      # built-in rasterizer renders at Chrome's default viewport, which would clip
      # the 411x914 design, so render them ourselves at the right size/scale (the
      # Pixel 7 the @Preview targets: 411x914 dp @ 2.625). google-chrome-stable
      # is preinstalled on ubuntu-latest.
      # The references name the branded faces (Space Grotesk / Orbitron /
      # JetBrains Mono) but can't @font-face them portably, so install the same
      # bundled .ttf the desktop candidate loads. Without this, headless Chrome
      # falls back to a system sans and every glyph drifts vs the candidate —
      # the dominant residual in the visual diff. fontconfig resolves them by
      # the families the HTML already declares; no reference edits needed.
      - name: Install branded fonts for reference rendering
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/fonts"
          cp meshcore-components/src/desktopMain/resources/fonts/*.ttf \
            "$HOME/.local/share/fonts/"
          fc-cache -f >/dev/null

      # Only the `claude-design` entries have an HTML source to rasterize. The
      # `figma` entries resolve through @design-parity/adapter-figma, which
      # renders the node itself over the REST API — skip them here.
      - name: Render reference images from HTML
        run: |
          set -euo pipefail
          for ref in $(jq -r '.components[] | select(.source == "claude-design") | .ref' design-map.json); do
            png="${ref%.html}.png"
            google-chrome-stable --headless=new --no-sandbox --disable-gpu \
              --hide-scrollbars --force-device-scale-factor=2.625 \
              --window-size=411,914 --screenshot="$png" "file://$PWD/$ref"
          done

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.18.1

      - name: Run design-parity
        env:
          # Same reason the render step sets these. This step joins every
          # `previewId` in design-map.json against the bundle manifest's
          # `rawPreviewIds`, and all but one of those ids carries a space and/or
          # an em-dash. Runs through 2026-08-03 reported "no candidate render
          # available" for 11 of 12 components — the survivor being
          # `CommandsPreview_Commands`, the only id with neither character —
          # while the job still went green. That join reproduces cleanly outside
          # CI (same bundle, same design-map, same design-parity version), so the
          # difference is environmental; the render step already forces UTF-8 for
          # exactly this reason and this step was left on the runner default.
          # Keep the whole pipeline on one encoding end to end.
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          # Needed by @design-parity/adapter-figma for the `figma:` entries in
          # design-map.json: it fetches node structure and renders the reference
          # image over the Figma REST API. A read-only personal access token with
          # `file_content:read` is sufficient — that scope covers both
          # /v1/files/:key/nodes and /v1/images.
          #
          # The adapter also probes /v1/files/:key/variables/local, which is
          # Enterprise-only; on this Pro team it 403s and the adapter degrades to
          # structure-only tokens. Harmless — spec tokens come from each entry's
          # `tokensFile` (design/meshcore.tokens.json), not from Figma.
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          set -euo pipefail
          components="$(jq -r '[.components[].code] | join(",")' design-map.json)"
          # 0.1.33 rasterises a vector reference at the CANDIDATE's density rather
          # than a fixed 2x of its own user units. Under 0.1.30 every `figma:` entry
          # here scored a flat "100.0% of pixels differ": this file's frames are
          # seeded from the published device-pixel figma-SVGs, so a 2x raster came
          # out at twice the 1078x2399 candidate — a delta far past
          # visualDimTolerancePx, which the diff correctly reports as a total
          # mismatch. The five figma components produce real numbers from here on.
          #
          # 0.1.34 adds two things that only bite the `figma:` entries. The Figma
          # adapter now populates `DesignReference.layout` from the node tree's
          # `absoluteBoundingBox`es, so the structural layout diff actually runs
          # for them — it was a silent no-op before (no reference geometry means
          # an early return, so a shifted row read as "no findings" rather than
          # "not checked", while the `claude-design` entries, which capture
          # geometry from their own render, reported normally). It also gives the
          # report a reference tree to draw box-model annotations from and a dp
          # space to map the candidate's readouts into. Separately, the visual
          # diff no longer saturates at a flat 100% when the two sides differ in
          # size beyond `visualDimTolerancePx`: it diffs the shared region and
          # reports the uncovered border, so a candidate that matches across its
          # overlap but runs taller scores as such instead of as a total mismatch.
          npx -y design-parity@0.1.38 run \
            --repo . \
            --components "$components" \
            --candidate-bundles build/design-parity/candidates.bundle.png,build/design-parity/candidates.app.bundle.png \
            --out build/design-parity/out \
            --repo-slug "${GITHUB_REPOSITORY}" \
            --branch design-parity/main \
            --source-commit "${GITHUB_SHA}"

      - name: Publish artifacts to design-parity/main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          art="$(mktemp -d)"
          cp -a build/design-parity/out/. "$art/"
          cp build/design-parity/candidates.bundle.png "$art/" || true
          cp build/design-parity/candidates.app.bundle.png "$art/" || true
          printf '%s\n' "$GITHUB_SHA" > "$art/SOURCE_COMMIT"
          cd "$art"
          git init -q
          git checkout -q -b design-parity/main
          git add -A
          git \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "design-parity artifacts for ${GITHUB_SHA}"
          git push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            design-parity/main

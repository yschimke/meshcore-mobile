name: Compose Preview

# One job runs the compose, resources and a11y pipelines. a11y used to run as
# its own parallel job, but a job with no compose pipeline has no visual diff
# to scope by, so the action checked (and commented on) every preview of the
# catalog on every PR: ~25 KB and the same findings each time, even on CI-only
# bumps. Run after compose in the same job, a11y checks only the previews this
# PR changed, which is usually none or a few, so the serial cost is small. The
# notifications pipeline stays skipped (see below).
#
# Generated branches live in the public output repository
# yschimke/meshcore-mobile-out, not here, so this repository's history stops
# growing with renders. Both apply steps pass `artifact-repository` +
# `artifacts-token`: the action pushes compose-preview/{main,pr},
# compose-preview/resources/{main,pr} and compose-preview/a11y/pr there, and in
# comment mode fetches the baselines it diffs against from there too (through a
# named remote it removes again at the end of the step). ARTIFACTS_TOKEN only
# has Contents write on the -out repository.
#
# Fork PRs get no secrets, so ARTIFACTS_TOKEN is empty there and the action
# falls back to the read-only GITHUB_TOKEN: the render runs, the push and the
# sticky comment fail — exactly as they did before the move (this workflow has
# never used the action's fork-safe `phase: render` / `publish` split).

on:
  push:
    branches: [main]
  pull_request:
    # `reopened` matters because the render is not just a check — it pushes the PR's
    # renders to `compose-preview/pr` and posts the sticky diff comment. Without it a
    # PR that is closed and reopened keeps whatever that branch held when it was
    # closed, which by then is usually another PR's renders, and nothing re-renders
    # until the next push. The other two `pull_request` workflows here (`pr-title`,
    # `no-ai-coauthors`) already list it; this one was the odd one out.
    #
    # `ready_for_review` is deliberately absent: nothing in this repo gates on draft
    # status, so a draft already renders on `opened`/`synchronize` and its head commit
    # carries those runs before it is marked ready. Adding it would re-run the render
    # on a commit that already has one.
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: compose-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Keeps the historical job id + check name so an existing required check
  # keeps matching.
  apply:
    name: Render previews (baseline or PR comment, auto-selected)
    # Skip on release-please PRs: they only bump the manifest, CHANGELOG and
    # version lines, all of which main's push CI already built. Matches the
    # bot-authored PR (or a bot dispatch); humans and main always run it.
    if: ${{ !(startsWith(github.head_ref || github.ref_name, 'release-please--') && (github.event.pull_request.user.login || github.actor) == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Dedicated read-only BuildFetch cache token (see settings.gradle.kts):
      # pull task outputs instead of building cold. Read-only, so safe at job
      # scope; ci.yml holds the read-write token and stays the sole cache writer.
      BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN: ${{ secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
      # The desktop/Skiko render resolves a glyph a preview's FontFamily doesn't
      # cover (CJK, here) through the system font path rather than continuing down
      # the FontFamily list, so stage the app's own committed Noto subsets where
      # fontconfig will find them before the render. These are the CJK/Arabic/…
      # subsets the app bundles (meshcore-components/.../fonts/noto) — no generic
      # Noto, so the Latin default is untouched. (Within-FontFamily fallback does
      # work for Arabic etc., but not the CJK faces on this Skiko build; #253.)
      - name: Stage bundled fallback fonts for the Skiko render
        run: |
          # fontconfig ships on ubuntu-latest, but guard so a leaner image can't
          # fail this step with `fc-cache: command not found` before the render.
          command -v fc-cache >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends fontconfig; }
          mkdir -p "$HOME/.local/share/fonts"
          cp meshcore-components/src/desktopMain/resources/fonts/noto/*.ttf "$HOME/.local/share/fonts/"
          fc-cache -f "$HOME/.local/share/fonts" >/dev/null
      - name: Record render start
        run: echo "RENDER_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - id: apply
        uses: yschimke/compose-ai-tools/.github/actions/apply@v2.74.1
        with:
          # Pin the render CLI to the Gradle plugin version (single source of
          # truth: composePreviewPlugin in libs.versions.toml) instead of the
          # action's `latest` default. A newer published CLI auto-installed
          # against the older applied plugin breaks preview discovery ("no
          # modules have the plugin applied" — the 0.15.9 CLI vs 0.15.8 plugin
          # skew); keying the CLI off the same catalog entry keeps them lockstep.
          cli-version: catalog
          catalog-key: composePreviewPlugin
          # The renderer can't rasterise our adaptive launcher icons
          # (mipmap/ic_launcher[_round]) to PNG, so those resource captures
          # produce no output. Downgrade missing renders from a hard error to a
          # warning (still surfaced in the PR comment) so the check isn't red on
          # a renderer limitation unrelated to the Compose previews themselves.
          missing-renders: warn
          # a11y after compose, so it is scoped to the previews this PR changed.
          only: compose,resources,a11y
          # Post "No visual changes detected" rather than nothing, so a clean
          # UI PR is distinguishable from one whose render never reported.
          comment-on-empty-diff: 'true'
          # See the header: generated branches go to the -out repository.
          artifact-repository: yschimke/meshcore-mobile-out
          artifacts-token: ${{ secrets.ARTIFACTS_TOKEN }}

      # A render that dies before the comparison (a Gradle or AGP break, as on
      # the AGP 9.5 bumps) leaves only a red check: the action posts nothing,
      # and a stale diff from an earlier push can still sit on the PR. Say so
      # in the sticky comment, unless this run already updated it. The next
      # successful run overwrites it through the same marker.
      - name: Report a failed render on the PR
        if: failure() && steps.apply.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail
          read -r id updated < <(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- preview-diff -->"))) | [.id, .updated_at] | @tsv' | tail -1) || true
          if [ -n "${updated:-}" ] && [[ ! "$updated" < "$RENDER_STARTED" ]]; then
            echo "This run already updated the preview-diff comment; leaving it."
            exit 0
          fi
          body=$(printf '%s\n' "<!-- preview-diff -->" "## Preview Changes" "" \
            "> [!CAUTION]" \
            "> The preview render failed at ${SHA:0:8}, so this PR has no preview diff for that commit. See [the run]($RUN_URL); \`/rerun previews\` retries it.")
          if [ -n "${id:-}" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null
          fi

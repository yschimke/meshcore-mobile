name: Compose Preview

# The pipelines run as two parallel jobs (compose+resources / a11y) instead
# of one serial `apply` invocation — they push to disjoint baseline/PR
# branches and post disjoint sticky comments, so the only reason they were
# serial (a shared Gradle build lock + `.git` in one workspace) disappears
# on separate runners. Wall time drops from the sum of the two renders to
# the slower one. The notifications pipeline stays skipped (see below).

on:
  push:
    branches: [main]
  pull_request:
    # `reopened` matters because the render is not just a check — it pushes the PR's
    # renders to `compose-preview/pr` and posts the sticky diff comment. Without it a
    # PR that is closed and reopened keeps whatever that branch held when it was
    # closed, which by then is usually another PR's renders, and nothing re-renders
    # until the next push. The other two `pull_request` workflows here (`pr-title`,
    # `no-ai-coauthors`) already list it; this one was the odd one out.
    #
    # `ready_for_review` is deliberately absent: nothing in this repo gates on draft
    # status, so a draft already renders on `opened`/`synchronize` and its head commit
    # carries those runs before it is marked ready. Adding it would re-run the render
    # on a commit that already has one.
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: compose-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Keeps the historical job id + check name so an existing required check
  # keeps matching; the a11y job below is a new check name.
  apply:
    name: Render previews (baseline or PR comment, auto-selected)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Dedicated read-only BuildFetch cache token (see settings.gradle.kts):
      # pull task outputs instead of building cold. Read-only, so safe at job
      # scope; ci.yml holds the read-write token and stays the sole cache writer.
      BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN: ${{ secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
      # The desktop/Skiko render resolves a glyph a preview's FontFamily doesn't
      # cover (CJK, here) through the system font path rather than continuing down
      # the FontFamily list, so stage the app's own committed Noto subsets where
      # fontconfig will find them before the render. These are the CJK/Arabic/…
      # subsets the app bundles (meshcore-components/.../fonts/noto) — no generic
      # Noto, so the Latin default is untouched. (Within-FontFamily fallback does
      # work for Arabic etc., but not the CJK faces on this Skiko build; #253.)
      - name: Stage bundled fallback fonts for the Skiko render
        run: |
          # fontconfig ships on ubuntu-latest, but guard so a leaner image can't
          # fail this step with `fc-cache: command not found` before the render.
          command -v fc-cache >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends fontconfig; }
          mkdir -p "$HOME/.local/share/fonts"
          cp meshcore-components/src/desktopMain/resources/fonts/noto/*.ttf "$HOME/.local/share/fonts/"
          fc-cache -f "$HOME/.local/share/fonts" >/dev/null
      - uses: yschimke/compose-ai-tools/.github/actions/apply@v1.31.0
        with:
          # Pin the render CLI to the Gradle plugin version (single source of
          # truth: composePreviewPlugin in libs.versions.toml) instead of the
          # action's `latest` default. A newer published CLI auto-installed
          # against the older applied plugin breaks preview discovery ("no
          # modules have the plugin applied" — the 0.15.9 CLI vs 0.15.8 plugin
          # skew); keying the CLI off the same catalog entry keeps them lockstep.
          cli-version: catalog
          catalog-key: composePreviewPlugin
          # The renderer can't rasterise our adaptive launcher icons
          # (mipmap/ic_launcher[_round]) to PNG, so those resource captures
          # produce no output. Downgrade missing renders from a hard error to a
          # warning (still surfaced in the PR comment) so the check isn't red on
          # a renderer limitation unrelated to the Compose previews themselves.
          missing-renders: warn
          only: compose,resources

  a11y:
    name: A11y previews
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Dedicated read-only BuildFetch cache token (see settings.gradle.kts):
      # pull task outputs instead of building cold. Read-only, so safe at job
      # scope; ci.yml holds the read-write token and stays the sole cache writer.
      BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN: ${{ secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
      # See the apply job: make the app's bundled Noto subsets visible to
      # fontconfig so the Skiko a11y render resolves CJK too.
      - name: Stage bundled fallback fonts for the Skiko render
        run: |
          # fontconfig ships on ubuntu-latest, but guard so a leaner image can't
          # fail this step with `fc-cache: command not found` before the render.
          command -v fc-cache >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends fontconfig; }
          mkdir -p "$HOME/.local/share/fonts"
          cp meshcore-components/src/desktopMain/resources/fonts/noto/*.ttf "$HOME/.local/share/fonts/"
          fc-cache -f "$HOME/.local/share/fonts" >/dev/null
      - uses: yschimke/compose-ai-tools/.github/actions/apply@v1.31.0
        with:
          cli-version: catalog
          catalog-key: composePreviewPlugin
          missing-renders: warn
          # The repo has no notification previews, and :meshcore-components (a
          # desktop preview module for design-parity) would otherwise be the only
          # module scanned by the notifications pipeline — which hard-fails when
          # no module produces a *Notification*.png. Only a11y runs here.
          only: a11y

name: Compose Preview

# One job runs the compose, resources and a11y pipelines. a11y used to run as
# its own parallel job, but a job with no compose pipeline has no visual diff
# to scope by, so the action checked (and commented on) every preview of the
# catalog on every PR: ~25 KB and the same findings each time, even on CI-only
# bumps. Run after compose in the same job, a11y checks only the previews this
# PR changed, which is usually none or a few, so the serial cost is small. The
# notifications pipeline stays skipped (see below).
#
# Generated branches live in the public output repository
# yschimke/meshcore-mobile-out, not here, so this repository's history stops
# growing with renders. Both apply steps pass `artifact-repository` +
# `artifacts-token`: the action pushes compose-preview/{main,pr},
# compose-preview/resources/{main,pr} and compose-preview/a11y/pr there, and in
# comment mode fetches the baselines it diffs against from there too (through a
# named remote it removes again at the end of the step). ARTIFACTS_TOKEN only
# has Contents write on the -out repository.
#
# Fork PRs get no secrets, so ARTIFACTS_TOKEN is empty there and the action
# falls back to the read-only GITHUB_TOKEN: the render runs, the push and the
# sticky comment fail — exactly as they did before the move (this workflow has
# never used the action's fork-safe `phase: render` / `publish` split).

on:
  push:
    branches: [main]
  pull_request:
    # `reopened` matters because the render is not just a check — it pushes the PR's
    # renders to `compose-preview/pr` and posts the sticky diff comment. Without it a
    # PR that is closed and reopened keeps whatever that branch held when it was
    # closed, which by then is usually another PR's renders, and nothing re-renders
    # until the next push. The other two `pull_request` workflows here (`pr-title`,
    # `no-ai-coauthors`) already list it; this one was the odd one out.
    #
    # `ready_for_review` is deliberately absent: nothing in this repo gates on draft
    # status, so a draft already renders on `opened`/`synchronize` and its head commit
    # carries those runs before it is marked ready. Adding it would re-run the render
    # on a commit that already has one.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to render and comment on (leave empty for baseline)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: compose-preview-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || inputs.pr_number != '' }}

jobs:
  # Fast pre-check so draft PRs, non-UI path-only PRs, and non-UI Renovate bumps
  # skip the full JDK + Android SDK + Gradle setup while still letting the
  # required `Render previews` check report as skipped (passing) on Protect Main.
  gate:
    name: Check if previews should run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      run: ${{ steps.decide.outputs.run }}
      pr_number: ${{ steps.decide.outputs.pr_number }}
    steps:
      - name: Checkout for diff inspection
        if: >-
          ${{
            github.event_name == 'pull_request' &&
            !github.event.pull_request.draft &&
            !(startsWith(github.head_ref || '', 'release-please--') && github.event.pull_request.user.login == 'github-actions[bot]')
          }}
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether to render previews
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft || false }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number || '' }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || '' }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

          # push to main and manual / checkbox workflow_dispatch always run.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip release-please PRs (version/changelog only).
          if [[ "$HEAD_REF" == release-please--* ]] && [ "$PR_AUTHOR" = "github-actions[bot]" ]; then
            echo "Skipping release-please PR."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip draft PRs; ready_for_review will trigger a render when ready.
          if [ "$IS_DRAFT" = "true" ]; then
            echo "Skipping draft PR #${PR_NUMBER}."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fail open if git diff is unavailable.
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Base SHA unavailable; failing open."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          decision=$(python3 - <<'PY'
          import fnmatch, json, os, re, subprocess
          from pathlib import Path

          base_sha = os.environ["BASE_SHA"]
          head_sha = os.environ["HEAD_SHA"]
          pr_author = os.environ["PR_AUTHOR"]
          head_ref = os.environ["HEAD_REF"]
          pr_title = os.environ["PR_TITLE"]

          files = [
              f.strip()
              for f in subprocess.check_output(
                  ["git", "diff", "--name-only", "--no-renames", base_sha, head_sha],
                  text=True,
              ).splitlines()
              if f.strip()
          ]
          if not files:
              print("run")
              raise SystemExit(0)

          # Non-UI paths from .github/preview-scope.json plus non-preview workflows.
          ignore_globs = []
          scope_file = Path(".github/preview-scope.json")
          if scope_file.is_file():
              ignore_globs = json.loads(scope_file.read_text()).get("ignorePaths", [])

          def is_ignored(path: str) -> bool:
              if path in (".github/workflows/compose-preview.yml", ".github/preview-scope.json"):
                  return False
              if path.startswith(".github/workflows/") or path.startswith(".github/scripts/"):
                  return True
              for pat in ignore_globs:
                  p = pat.rstrip("/")
                  if p.endswith("/**"):
                      prefix = p[:-3]
                      if path == prefix or path.startswith(prefix + "/"):
                          return True
                  elif p.startswith("**/"):
                      if fnmatch.fnmatch(path, p) or fnmatch.fnmatch(Path(path).name, p[3:]):
                          return True
                  elif fnmatch.fnmatch(path, p):
                      return True
              return False

          if all(is_ignored(f) for f in files):
              print("skip_paths")
              raise SystemExit(0)

          # Renovate PRs: run by default only when UI-affecting dependencies change.
          is_renovate = pr_author == "renovate[bot]" or head_ref.startswith("renovate/")
          dep_only_files = all(
              f in ("gradle/libs.versions.toml", "gradle.properties", "gradle/wrapper/gradle-wrapper.properties")
              or f.endswith(".lock")
              or f.startswith(".github/workflows/")
              or is_ignored(f)
              for f in files
          )
          if is_renovate and dep_only_files:
              diff_text = subprocess.check_output(
                  ["git", "diff", "-U0", base_sha, head_sha], text=True, errors="replace"
              )
              changed_lines = "\n".join(
                  line for line in diff_text.splitlines()
                  if (line.startswith("+") or line.startswith("-"))
                  and not line.startswith("+++") and not line.startswith("---")
              )
              haystack = f"{head_ref}\n{pr_title}\n{changed_lines}"
              ui_re = re.compile(
                  r"compose|material|rc[-_]players|compose[-_]?ai|compose[-_]?preview|"
                  r"skiko|coil|livery|glance|horologist|wear|accompanist|robolectric|"
                  r"lottie|svg|agp|android[-_]?gradle|kotlin|ksp|metro|paparazzi|"
                  r"androidx\.(ui|core|activity|navigation|window|graphics|appcompat)",
                  re.I,
              )
              if not ui_re.search(haystack):
                  print("skip_renovate")
                  raise SystemExit(0)

          print("run")
          PY
          )

          echo "Gate decision: ${decision}"
          if [ "$decision" = "run" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "run=false" >> "$GITHUB_OUTPUT"

          # On Renovate non-UI skips (same-repo PRs), post/update a sticky comment
          # with a checkbox so a maintainer can trigger a render on demand.
          if [ "$decision" = "skip_renovate" ] && [ "$HEAD_REPO" = "$REPO" ]; then
            id=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- preview-diff -->"))) | .id' | tail -1) || true
            body=$(printf '%s\n' \
              "<!-- preview-diff -->" \
              "## Preview Changes" \
              "" \
              "Skipped automatically for non-UI dependency update (\`${HEAD_SHA:0:8}\`)." \
              "" \
              "- [ ] Run Compose Preview on this PR")
            if [ -n "${id:-}" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
            else
              gh api "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
            fi
          fi

  # Keeps the historical job id + check name so an existing required check
  # keeps matching.
  apply:
    name: Render previews (baseline or PR comment, auto-selected)
    needs: gate
    # Skip when the gate cleanly decided not to run. A skipped required check
    # reports as passing; `!cancelled()` + `result != 'success'` fails open if
    # the gate itself errors.
    if: ${{ !cancelled() && (needs.gate.result != 'success' || needs.gate.outputs.run != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Seed BuildFetch with render/compile task outputs on trusted pushes to
      # main; read-only on PRs and manual dispatches so PRs pull warm outputs.
      BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN: ${{ github.event_name == 'push' && secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      ON_CI: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/head', inputs.pr_number) || '' }}
      - uses: ./.github/actions/setup
        with:
          cache-read-only: ${{ (github.event_name == 'pull_request' || inputs.pr_number != '') && 'true' || 'false' }}
      # The desktop/Skiko render resolves a glyph a preview's FontFamily doesn't
      # cover (CJK, here) through the system font path rather than continuing down
      # the FontFamily list, so stage the app's own committed Noto subsets where
      # fontconfig will find them before the render. These are the CJK/Arabic/…
      # subsets the app bundles (meshcore-components/.../fonts/noto) — no generic
      # Noto, so the Latin default is untouched. (Within-FontFamily fallback does
      # work for Arabic etc., but not the CJK faces on this Skiko build; #253.)
      - name: Stage bundled fallback fonts for the Skiko render
        run: |
          # fontconfig ships on ubuntu-latest, but guard so a leaner image can't
          # fail this step with `fc-cache: command not found` before the render.
          command -v fc-cache >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends fontconfig; }
          mkdir -p "$HOME/.local/share/fonts"
          cp meshcore-components/src/desktopMain/resources/fonts/noto/*.ttf "$HOME/.local/share/fonts/"
          fc-cache -f "$HOME/.local/share/fonts" >/dev/null
      - name: Record render start
        run: echo "RENDER_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Install the pinned preview CLI through the release API
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/install-preview-cli.py
      - id: apply
        uses: yschimke/compose-ai-tools/.github/actions/apply@v2.102.0
        with:
          mode: ${{ inputs.pr_number != '' && 'comment' || 'auto' }}
          pr-number: ${{ inputs.pr_number || '' }}
          # Render the debug variant explicitly. AGP 9.5 turns unit tests off for release
          # variants, and Compose Preview packages Android resources through the variant's
          # unit-test APK, so a release render fails before it starts (compose-ai-tools #6382).
          variant: debug
          # Pin the render CLI to the Gradle plugin version (single source of
          # truth: composePreviewPlugin in libs.versions.toml) instead of the
          # action's `latest` default. A newer published CLI auto-installed
          # against the older applied plugin breaks preview discovery ("no
          # modules have the plugin applied" — the 0.15.9 CLI vs 0.15.8 plugin
          # skew); keying the CLI off the same catalog entry keeps them lockstep.
          # Already installed above from the catalog version, with its release digest verified.
          cli-version: none
          # The renderer can't rasterise our adaptive launcher icons
          # (mipmap/ic_launcher[_round]) to PNG, so those resource captures
          # produce no output. Downgrade missing renders from a hard error to a
          # warning (still surfaced in the PR comment) so the check isn't red on
          # a renderer limitation unrelated to the Compose previews themselves.
          missing-renders: warn
          # a11y after compose, so it is scoped to the previews this PR changed.
          only: compose,resources,a11y
          # Post "No visual changes detected" rather than nothing, so a clean
          # UI PR is distinguishable from one whose render never reported.
          comment-on-empty-diff: 'true'
          # See the header: generated branches go to the -out repository.
          artifact-repository: yschimke/meshcore-mobile-out
          artifacts-token: ${{ secrets.ARTIFACTS_TOKEN }}

      # A render that dies before the comparison (a Gradle or AGP break, as on
      # the AGP 9.5 bumps) leaves only a red check: the action posts nothing,
      # and a stale diff from an earlier push can still sit on the PR. Say so
      # in the sticky comment, unless this run already updated it. The next
      # successful run overwrites it through the same marker.
      - name: Report a failed render on the PR
        if: failure() && steps.apply.outcome == 'failure' && (github.event_name == 'pull_request' || inputs.pr_number != '')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail
          read -r id updated < <(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- preview-diff -->"))) | [.id, .updated_at] | @tsv' | tail -1) || true
          if [ -n "${updated:-}" ] && [[ ! "$updated" < "$RENDER_STARTED" ]]; then
            echo "This run already updated the preview-diff comment; leaving it."
            exit 0
          fi
          body=$(printf '%s\n' "<!-- preview-diff -->" "## Preview Changes" "" \
            "> [!CAUTION]" \
            "> The preview render failed at ${SHA:0:8}, so this PR has no preview diff for that commit. See [the run]($RUN_URL); \`/rerun previews\` retries it." \
            "" \
            "- [ ] Re-run Compose Preview")
          if [ -n "${id:-}" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null
          fi

      # Restores the gate `missing-renders: warn` gives up, narrowed to what is
      # actually unfixable: launcher-icon resource captures and synthetic
      # `activity__*` previews. Any AUTHORED preview that fails to render still
      # fails the run, so a Renovate bump that breaks the widget previews (as the
      # connector/player drift from #632 did) can't automerge green. Runs on
      # failure too, so a red render is diagnosed rather than masked.
      - name: Fail on authored preview render errors
        if: always()
        run: bash .github/scripts/check-render-errors.sh .

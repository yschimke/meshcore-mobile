name: Compose Preview

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to render and comment on (leave empty for baseline)'
        required: false
        default: ''

permissions: {}

concurrency:
  group: compose-preview-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || inputs.pr_number != '' }}

jobs:
  preview:
    permissions:
      contents: write
      pull-requests: write
    uses: yschimke/compose-ai-tools/.github/workflows/compose-preview-reusable.yml@2f91b8e3b158d70919e9926ce46f26fd348c1319
    with:
      pr-number: ${{ inputs.pr_number || '' }}
      artifact-repository: yschimke/meshcore-mobile-out
      variant: debug
      cli-version: none
      only: compose,resources,a11y
      missing-renders: warn
      java-version: '21.0.13+100000002.0.LTS'
      android-sdk-packages: 'platform-tools platforms;android-37.1 build-tools;37.0.0'
      pre-render-command: >-
        python3 scripts/prepare-gradle.py &&
        python3 scripts/prepare-ci-artifacts.py maven &&
        (command -v fc-cache >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends fontconfig; }) &&
        mkdir -p "$HOME/.local/share/fonts" &&
        cp meshcore-components/src/desktopMain/resources/fonts/noto/*.ttf "$HOME/.local/share/fonts/" &&
        fc-cache -f "$HOME/.local/share/fonts" >/dev/null &&
        python3 scripts/install-preview-cli.py
      post-render-command: bash .github/scripts/check-render-errors.sh .
    secrets:
      artifacts-token: ${{ secrets.ARTIFACTS_TOKEN }}
      buildfetch-rw-token: ${{ github.event_name == 'push' && secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN || '' }}
      buildfetch-ro-token: ${{ secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}

name: Cache regressions

on:
  pull_request:
    paths:
      - '.github/actions/setup/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/cache-*.yml'
      - 'scripts/*cache*'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Gradle distribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare-gradle.py
      - name: Verify setup and actual Gradle cache configuration with synthetic tokens
        run: |
          python3 scripts/test-prepare-gradle.py
          python3 scripts/test-cache-mode.py --gradle
      - name: Verify independent build and relocation failure propagation, including real Gradle
        run: python3 scripts/test-cache-diagnostics.py --gradle

name: Release Please

# Maintains a release PR from conventional-commit history. When merged,
# release-please cuts the tag + GitHub Release, then this workflow calls
# release-build.yml via workflow_call to build and publish artifacts.
# This bypasses the GITHUB_TOKEN recursion guard that otherwise prevents
# tag-push events from triggering downstream workflows.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json


      - name: Materialize the draft release tag
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          python - <<'PYTHON'
          import json,os,subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          tag=os.environ['RELEASE_TAG']
          pages=json.loads(subprocess.check_output(['gh','api','--paginate','--slurp',f'repos/{repo}/releases?per_page=100']))
          matches=[r for page in pages for r in page if r['tag_name']==tag]
          if len(matches)!=1: raise SystemExit('Expected exactly one release draft')
          release=matches[0]
          if not release['draft']: raise SystemExit('Expected an unpublished draft release')
          sha=subprocess.check_output(['gh','api',f'repos/{repo}/commits/{release["target_commitish"]}','--jq','.sha'],text=True).strip()
          lookup=subprocess.run(['gh','api',f'repos/{repo}/git/ref/tags/{tag}'],capture_output=True,text=True)
          if lookup.returncode:
              if '404' not in lookup.stderr: raise SystemExit(lookup.stderr)
              subprocess.run(['gh','api','--method','POST',f'repos/{repo}/git/refs','-f',f'ref=refs/tags/{tag}','-f',f'sha={sha}'],check=True)
          else:
              actual=subprocess.check_output(['gh','api',f'repos/{repo}/commits/{tag}','--jq','.sha'],text=True).strip()
              if actual!=sha: raise SystemExit('Existing tag points to a different source')
          PYTHON

  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
    permissions:
      contents: write
      packages: write

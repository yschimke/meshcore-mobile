name: Typed component catalog

on:
  pull_request:
    branches: [main]
    paths:
      - 'ui-builder-catalog/**'
      - 'ui-builder-catalog-consumer/**'
      - 'ui-builder-catalog-renderer/**'
      - 'scripts/validate-typed-catalog.sh'
      - 'scripts/typed-renderer-smoke.py'
      - 'scripts/publish-typed-catalog.sh'
      - '.github/workflows/typed-catalog.yml'
      - '**/*.gradle.kts'
      - 'gradle/**'
      - 'meshcore-components/**'
      - 'meshcore-core/**'
  push:
    branches: [main]
    paths:
      - 'ui-builder-catalog/**'
      - 'ui-builder-catalog-consumer/**'
      - 'ui-builder-catalog-renderer/**'
      - 'scripts/validate-typed-catalog.sh'
      - 'scripts/typed-renderer-smoke.py'
      - 'scripts/publish-typed-catalog.sh'
      - '.github/workflows/typed-catalog.yml'
      - '**/*.gradle.kts'
      - 'gradle/**'
      - 'meshcore-components/**'
      - 'meshcore-core/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  catalog:
    # Skip on release-please PRs: they only bump the manifest, CHANGELOG and
    # version lines, all of which main's push CI already built. Matches the
    # bot-authored PR (or a bot dispatch); humans and main always run it.
    if: ${{ !(startsWith(github.head_ref || github.ref_name, 'release-please--') && (github.event.pull_request.user.login || github.actor) == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: meshcore-mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: meshcore-mobile
          persist-credentials: false
      # Coordinated, immutable sources: the released typed API (list and object properties) and the
      # renderer SDK that edits and renders them, built from source as a composite.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yschimke/compose-ai-tools
          ref: v2.54.0
          path: compose-ai-tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yschimke/compose-ui-builder
          ref: v3.111.0
          path: compose-ui-builder
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            21
            17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - name: Install Android platform used by the app
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"'
      - name: Generate, render and validate in a separate catalog consumer
        run: scripts/validate-typed-catalog.sh "$GITHUB_WORKSPACE/compose-ai-tools" "$GITHUB_WORKSPACE/compose-ui-builder"
      - name: Package the typed Wasm renderer
        run: ./gradlew -PcomposeUiBuilderDir="$GITHUB_WORKSPACE/compose-ui-builder" :ui-builder-catalog-renderer:rendererArchive
      - name: Install browser smoke dependencies
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install chromium --with-deps
      - name: Render and interact through the packaged sandbox protocol
        run: python scripts/typed-renderer-smoke.py
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meshcore-mobile-typed-catalog
          path: |
            meshcore-mobile/ui-builder-catalog-renderer/build/ui-builder-runtime.zip
            meshcore-mobile/ui-builder-catalog-renderer/build/smoke
            meshcore-mobile/ui-builder-catalog-consumer/build/test-results
            meshcore-mobile/ui-builder-catalog/build/catalog
            meshcore-mobile/ui-builder-catalog/build/renders
            meshcore-mobile/ui-builder-catalog/build/test-results
            meshcore-mobile/ui-builder-catalog/build/distributions
            compose-ui-builder/ui-builder-runtime/build/test-results/test
            compose-ui-builder/ui-builder/build/test-results/jvmTest
            compose-ui-builder/ui-builder/build/typed-catalog/e2e
          if-no-files-found: warn

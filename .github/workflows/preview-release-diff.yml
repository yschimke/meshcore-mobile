name: Preview Release Diff

# Release-to-release preview comparison. compose-ai-tools' reusable workflow
# (preview-release-diff-reusable.yml) renders every @Preview at the previous release tag and at
# the new one, then compares them by sha256. It pushes the before/after PNGs of every changed or
# new preview to the `compose-preview/releases` branch of yschimke/meshcore-mobile-out, and adds a
# collapsed "Preview changes since <previous tag>" section to the release notes. When anything
# changed, the Preview Audit (preview-audit.yml, release mode) runs once over that set and appends
# its findings to the release notes.
#
# Called from release-please.yml, because a release created with GITHUB_TOKEN raises no `release`
# event. Manual run: Actions -> Preview Release Diff -> Run workflow with a tag, and optionally
# the tag to compare against.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to compare (e.g. v0.1.10)
        required: true
        type: string
      base:
        description: Tag to compare against (default the previous v* tag)
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to compare (e.g. v0.1.10)
        required: true
      base:
        description: Tag to compare against (default the previous v* tag)
        required: false
        default: ''

permissions: {}

concurrency:
  group: preview-release-diff-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  diff:
    uses: yschimke/compose-ai-tools/.github/workflows/preview-release-diff-reusable.yml@v2.87.0
    with:
      tag: ${{ inputs.tag }}
      base: ${{ inputs.base }}
      out-repo: yschimke/meshcore-mobile-out
      catalog-key: composePreviewPlugin
      setup: local
      pre-render: |
        command -v fc-cache >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends fontconfig; }
        mkdir -p "$HOME/.local/share/fonts"
        cp meshcore-components/src/desktopMain/resources/fonts/noto/*.ttf "$HOME/.local/share/fonts/" 2>/dev/null || true
        fc-cache -f "$HOME/.local/share/fonts" >/dev/null
    secrets:
      push_token: ${{ secrets.ARTIFACTS_TOKEN }}
      buildfetch_cache_token: ${{ secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
    permissions:
      contents: write

  audit:
    name: Audit
    needs: diff
    if: needs.diff.outputs.changed == 'true'
    uses: ./.github/workflows/preview-audit.yml
    with:
      release: ${{ needs.diff.outputs.head }}
      base: ${{ needs.diff.outputs.base }}
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

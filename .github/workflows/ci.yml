name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Assemble (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # BuildFetch remote cache (see settings.gradle.kts). Token is absent on fork PRs, which
      # disables the cache there. Writes happen only on trusted main-branch builds.
      BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN: ${{ secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN }}
      ON_CI: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: ./.github/actions/setup
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # Main-branch runs push to the BuildFetch remote cache (settings.gradle.kts disables the
          # local cache there); don't restore/save the unused local build cache to the Actions cache.
          exclude-local-build-cache: ${{ github.ref == 'refs/heads/main' }}

      - run: ./gradlew :app:assembleDebug :wear:assembleDebug --stacktrace

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN: ${{ secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN }}
      ON_CI: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: ./.github/actions/setup
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # Main-branch runs push to the BuildFetch remote cache (settings.gradle.kts disables the
          # local cache there); don't restore/save the unused local build cache to the Actions cache.
          exclude-local-build-cache: ${{ github.ref == 'refs/heads/main' }}

      - run: ./gradlew test --stacktrace

      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN: ${{ secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN }}
      ON_CI: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: ./.github/actions/setup
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # Main-branch runs push to the BuildFetch remote cache (settings.gradle.kts disables the
          # local cache there); don't restore/save the unused local build cache to the Actions cache.
          exclude-local-build-cache: ${{ github.ref == 'refs/heads/main' }}

      - run: ./gradlew lintDebug --stacktrace

      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
          if-no-files-found: ignore

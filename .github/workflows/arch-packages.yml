name: Arch packages

# Builds packaging/aur/meshcore-desktop-bin for a published release and ships it two ways:
#
# - pacman repository: the package and the `meshcore` repo database live as assets on the
#   `pacman-repo` prerelease of this repository, so `pacman -Syu` updates MeshCore once a machine
#   adds the repo (docs/desktop-linux.md). Needs no account; on for every release.
# - AUR: pushes the PKGBUILD to aur.archlinux.org/packages/meshcore-desktop-bin for paru/yay users.
#   Off until the repository variable AUR_PUBLISH is 'true' and the secret AUR_SSH_PRIVATE_KEY
#   holds a key registered to an AUR account (registration was paused when this was written).
#   Setup, once: create an AUR account (https://aur.archlinux.org/register), add an SSH public key
#   to it, store the private key as AUR_SSH_PRIVATE_KEY and set AUR_PUBLISH to 'true'. The first
#   push creates the AUR package; later pushes update it.
#
# The PKGBUILD's pkgver comes from the tag and the .deb checksum from the release's
# SHA256SUMS-desktop-linux-x64.txt. release-build.yml calls this once it publishes the release. On
# pull requests that touch the packaging it only builds, against the newest release with a .deb, so
# a broken package fails here rather than on users' machines.

on:
  pull_request:
    paths:
      - 'packaging/aur/**'
      - '.github/workflows/arch-packages.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag to package (e.g. v0.1.8)'
        required: true
        type: string
      push_repo:
        description: 'Publish to the pacman repository (the pacman-repo release)'
        type: boolean
        default: true
      push_aur:
        description: 'Push to the AUR'
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      push_repo:
        type: boolean
        default: true
      push_aur:
        type: boolean
        default: false
    secrets:
      AUR_SSH_PRIVATE_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: arch-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PKG: meshcore-desktop-bin
  DESKTOP_FILE: meshcore-desktop.desktop
  PACMAN_REPO: meshcore
  PACMAN_REPO_TAG: pacman-repo

jobs:
  build:
    name: Build meshcore-desktop-bin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:base-devel
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install tools
        run: pacman -Syu --noconfirm --needed github-cli desktop-file-utils
      - name: Resolve the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -n "$TAG" ]]; then
            tag="$TAG"
          else
            # The newest release with a Linux installer, so a release whose assets failed to attach
            # doesn't break every packaging PR.
            tag=""
            for candidate in $(gh release list --exclude-drafts --exclude-pre-releases --limit 10 --json tagName --jq '.[].tagName | select(startswith("v"))'); do
              if gh release view "$candidate" --json assets --jq '.assets[].name' | grep -qx "meshcore-desktop-${candidate#v}-linux-x64.deb"; then
                tag="$candidate"
                break
              fi
            done
            [[ -n "$tag" ]] || { echo "::error::no recent release has a Linux .deb"; exit 1; }
          fi
          version="${tag#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$tag is not vMAJOR.MINOR.PATCH"; exit 1; }
          [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" == "false" ]] \
            || { echo "::error::$tag is still a draft; its download URLs are not public yet"; exit 1; }
          deb="meshcore-desktop-$version-linux-x64.deb"
          sum="$(gh release download "$tag" -p SHA256SUMS-desktop-linux-x64.txt -O - | awk -v f="$deb" '$2 == f { print $1 }')"
          [[ "$sum" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no checksum for $deb in $tag"; exit 1; }
          echo "Packaging $deb from $tag (sha256 $sum)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"
      - name: Stamp the PKGBUILD
        working-directory: packaging/aur/meshcore-desktop-bin
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DEB_SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          set -euo pipefail
          desktop_sha256="$(sha256sum "$DESKTOP_FILE" | cut -d' ' -f1)"
          sed -i \
            -e "s/^pkgver=.*/pkgver=$VERSION/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "/^sha256sums=(/,/)/c\\sha256sums=('$DEB_SHA256'\\n            '$desktop_sha256')" \
            PKGBUILD
          grep -E '^(pkgver|pkgrel)=' PKGBUILD
          grep -A1 '^sha256sums=' PKGBUILD
      # makepkg refuses to run as root, and the builder can't sudo: install the dependencies first.
      - name: Build the package
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          pacman -S --noconfirm --needed $(source packaging/aur/meshcore-desktop-bin/PKGBUILD && echo "${depends[@]}")
          useradd -m builder
          cp -r packaging/aur/meshcore-desktop-bin /home/builder/pkg
          chown -R builder: /home/builder/pkg
          su builder -c 'cd ~/pkg && makepkg --printsrcinfo > .SRCINFO && makepkg --noconfirm --noprogressbar' \
            || { echo "::error::makepkg failed"; exit 1; }
          pacman -Qip /home/builder/pkg/"$PKG"-*.pkg.tar.zst
          pacman -Qlp /home/builder/pkg/"$PKG"-*.pkg.tar.zst | grep -E '/usr/(bin|share)/'
          desktop-file-validate /home/builder/pkg/pkg/"$PKG"/usr/share/applications/"$DESKTOP_FILE"
          mkdir -p "$GITHUB_WORKSPACE/_arch"
          cp /home/builder/pkg/{PKGBUILD,.SRCINFO,"$DESKTOP_FILE"} /home/builder/pkg/"$PKG"-*.pkg.tar.zst "$GITHUB_WORKSPACE/_arch/"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: arch-package
          path: _arch/
          include-hidden-files: true
          if-no-files-found: error

  pacman-repo:
    name: Publish to the pacman repository
    needs: build
    if: inputs.push_repo == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:base-devel
    permissions:
      contents: write
    # One writer at a time: each run rewrites the repo database from the last one's.
    concurrency:
      group: pacman-repo
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed github-cli
      - uses: actions/download-artifact@v8.0.2
        with:
          name: arch-package
          path: _arch
      - name: Update the repository
        run: |
          set -euo pipefail
          pkg="$(basename _arch/"$PKG"-*.pkg.tar.zst)"
          if ! gh release view "$PACMAN_REPO_TAG" >/dev/null 2>&1; then
            gh release create "$PACMAN_REPO_TAG" --prerelease --latest=false --title 'pacman repository' \
              --notes 'Arch Linux package repository for the MeshCore desktop app, rewritten by every release. See docs/desktop-linux.md to add it to pacman.conf; nothing here is meant to be downloaded by hand.'
          fi
          assets="$(gh release view "$PACMAN_REPO_TAG" --json assets --jq '.assets[].name')"
          mkdir repo
          cd repo
          for f in db files; do
            if grep -qx "$PACMAN_REPO.$f.tar.zst" <<<"$assets"; then
              gh release download "$PACMAN_REPO_TAG" -p "$PACMAN_REPO.$f.tar.zst"
            fi
          done
          cp "../_arch/$pkg" .
          repo-add "$PACMAN_REPO.db.tar.zst" "$pkg"
          # repo-add links $PACMAN_REPO.db -> .db.tar.zst; release assets can't be links.
          for f in db files; do
            rm "$PACMAN_REPO.$f"
            cp "$PACMAN_REPO.$f.tar.zst" "$PACMAN_REPO.$f"
          done
          # The package first, so the database never names a file that isn't there yet.
          gh release upload "$PACMAN_REPO_TAG" "$pkg" --clobber
          gh release upload "$PACMAN_REPO_TAG" \
            "$PACMAN_REPO.db" "$PACMAN_REPO.db.tar.zst" "$PACMAN_REPO.files" "$PACMAN_REPO.files.tar.zst" --clobber
          # Keep the previous version too: a pacman -Syu that read the old database just before this
          # run is still downloading (or waiting at its prompt for) that package. Older ones go.
          { grep -E "^$PKG-.*\.pkg\.tar\.zst$" <<<"$assets" || true; } | { grep -vxF "$pkg" || true; } \
            | sort -V | head -n -1 | while read -r old; do
            gh release delete-asset "$PACMAN_REPO_TAG" "$old" --yes
          done
          echo "Published $pkg to the $PACMAN_REPO pacman repository" >> "$GITHUB_STEP_SUMMARY"

  aur:
    name: Push to the AUR
    needs: build
    if: inputs.push_aur == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: arch-package
          path: _arch
      - name: Push
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$AUR_SSH_PRIVATE_KEY" ]] || { echo "::error::AUR_SSH_PRIVATE_KEY is not set"; exit 1; }
          install -dm700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # Pinned: SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4, as the Arch wiki's AUR page lists it.
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/aur -o IdentitiesOnly=yes'
          git clone "ssh://aur@aur.archlinux.org/$PKG.git" aur
          cp _arch/{PKGBUILD,.SRCINFO,"$DESKTOP_FILE"} aur/
          cd aur
          git add PKGBUILD .SRCINFO "$DESKTOP_FILE"
          if git diff --cached --quiet; then
            echo "The AUR already has $PKG $VERSION" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name='Yuri Schimke' -c user.email='yuri@schimke.ee' commit -m "Update to $VERSION"
          git push origin HEAD:master
          echo "Pushed $PKG $VERSION to https://aur.archlinux.org/packages/$PKG" >> "$GITHUB_STEP_SUMMARY"

name: Arch packages

# Builds packaging/aur/meshcore-desktop-bin for a release and ships it two ways:
#
# - pacman repository: each release carries the `meshcore` repo database and its own package as
#   assets, so `Server = .../releases/latest/download` always serves the newest one and
#   `pacman -Syu` updates MeshCore once a machine adds the repo (docs/desktop-linux.md). Releases
#   here are immutable once published, so this runs while the release is still a draft: the
#   release workflow calls it after the desktop installers are attached and publishes the release
#   only once it has succeeded. Drafts' download URLs aren't public, so the .deb is downloaded with
#   the API and handed to makepkg instead of fetched from the PKGBUILD's public URL. The previous
#   release's package is attached too, outside the database, so a `pacman -Syu` that read the old
#   database just before the switch still finds its package under latest/download.
# - AUR: pushes the PKGBUILD to aur.archlinux.org/packages/meshcore-desktop-bin for paru/yay users.
#   The AUR builds from the public .deb URL, so the release workflow runs this after publishing.
#   Off until the repository variable AUR_PUBLISH is 'true' and the secret AUR_SSH_PRIVATE_KEY
#   holds a key registered to an AUR account (registration was paused when this was written).
#   Setup, once: create an AUR account (https://aur.archlinux.org/register), add an SSH public key
#   to it, store the private key as AUR_SSH_PRIVATE_KEY and set AUR_PUBLISH to 'true'. The first
#   push creates the AUR package; later pushes update it.
#
# The PKGBUILD's pkgver comes from the tag and the .deb checksum from the release's
# SHA256SUMS-desktop-linux-x64.txt. On pull requests that touch the packaging it only builds (the
# package and a throwaway repo database), against the newest release with a .deb, so a broken
# package fails here rather than on users' machines.

on:
  pull_request:
    paths:
      - 'packaging/aur/**'
      - '.github/workflows/arch-packages.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to package (e.g. v0.1.8)'
        required: true
        type: string
      push_repo:
        description: 'Attach the pacman repository to the release (it must still be a draft)'
        type: boolean
        default: false
      push_aur:
        description: 'Push to the AUR (the release must be published)'
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      push_repo:
        type: boolean
        default: false
      push_aur:
        type: boolean
        default: false
    secrets:
      AUR_SSH_PRIVATE_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: arch-${{ inputs.tag || github.ref }}${{ inputs.push_repo && '-repo' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PKG: meshcore-desktop-bin
  DESKTOP_FILE: meshcore-desktop.desktop
  PACMAN_REPO: meshcore
  # The release workflow calls this twice in one run (repo before publishing, AUR after), and
  # artifact names must be unique within a run.
  ARTIFACT: arch-package${{ inputs.push_repo && '-repo' || '' }}

jobs:
  build:
    name: Build meshcore-desktop-bin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:base-devel
    # Draft releases are visible only to tokens with push access, and the release workflow runs this
    # before publishing.
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install tools
        run: pacman -Syu --noconfirm --needed github-cli desktop-file-utils
      - name: Resolve the release
        id: release
        env:
          TAG: ${{ inputs.tag }}
          PUSH_REPO: ${{ inputs.push_repo == true }}
          PUSH_AUR: ${{ inputs.push_aur == true }}
        run: |
          set -euo pipefail
          if [[ -n "$TAG" ]]; then
            tag="$TAG"
          else
            # The newest release with a Linux installer, so a release whose assets failed to attach
            # doesn't break every packaging PR.
            tag=""
            for candidate in $(gh release list --exclude-drafts --exclude-pre-releases --limit 10 --json tagName --jq '.[].tagName | select(startswith("v"))'); do
              if gh release view "$candidate" --json assets --jq '.assets[].name' | grep -qx "meshcore-desktop-${candidate#v}-linux-x64.deb"; then
                tag="$candidate"
                break
              fi
            done
            [[ -n "$tag" ]] || { echo "::error::no recent release has a Linux .deb"; exit 1; }
          fi
          version="${tag#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$tag is not vMAJOR.MINOR.PATCH"; exit 1; }
          draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
          # Published releases are immutable: the repository can only be attached to a draft.
          if [[ "$PUSH_REPO" == "true" && "$draft" != "true" ]]; then
            echo "::error::$tag is already published (immutable); the pacman repository can only be attached to a draft"
            exit 1
          fi
          # The AUR fetches the .deb from its public URL, which a draft doesn't have.
          if [[ "$PUSH_AUR" == "true" && "$draft" != "false" ]]; then
            echo "::error::$tag is still a draft; the AUR needs its public download URL"
            exit 1
          fi
          deb="meshcore-desktop-$version-linux-x64.deb"
          sum="$(gh release download "$tag" -p SHA256SUMS-desktop-linux-x64.txt -O - | awk -v f="$deb" '$2 == f { print $1 }')"
          [[ "$sum" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no checksum for $deb in $tag"; exit 1; }
          echo "Packaging $deb from $tag (sha256 $sum, draft $draft)"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "sha256=$sum"
          } >> "$GITHUB_OUTPUT"
      - name: Stamp the PKGBUILD
        working-directory: packaging/aur/meshcore-desktop-bin
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DEB_SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          set -euo pipefail
          desktop_sha256="$(sha256sum "$DESKTOP_FILE" | cut -d' ' -f1)"
          sed -i \
            -e "s/^pkgver=.*/pkgver=$VERSION/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "/^sha256sums=(/,/)/c\\sha256sums=('$DEB_SHA256'\\n            '$desktop_sha256')" \
            PKGBUILD
          grep -E '^(pkgver|pkgrel)=' PKGBUILD
          grep -A1 '^sha256sums=' PKGBUILD
      # A draft's download URL isn't public, so fetch the .deb with the API and leave it where
      # makepkg looks for the PKGBUILD's first source (`<name>::<url>`): makepkg then uses it, and
      # still checks it against sha256sums, instead of downloading. The PKGBUILD keeps its public
      # URL for the AUR.
      - name: Download the .deb
        working-directory: packaging/aur/meshcore-desktop-bin
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091,SC2154
          src="$(source ./PKGBUILD && echo "${source[0]%%::*}")"
          gh release download "$TAG" -p "meshcore-desktop-$VERSION-linux-x64.deb" -O "$src"
          ls -l "$src"
      # makepkg refuses to run as root, and the builder can't sudo: install the dependencies first.
      - name: Build the package
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          pacman -S --noconfirm --needed $(source packaging/aur/meshcore-desktop-bin/PKGBUILD && echo "${depends[@]}")
          useradd -m builder
          cp -r packaging/aur/meshcore-desktop-bin /home/builder/pkg
          chown -R builder: /home/builder/pkg
          su builder -c 'cd ~/pkg && makepkg --printsrcinfo > .SRCINFO && makepkg --noconfirm --noprogressbar' \
            || { echo "::error::makepkg failed"; exit 1; }
          pacman -Qip /home/builder/pkg/"$PKG"-*.pkg.tar.zst
          pacman -Qlp /home/builder/pkg/"$PKG"-*.pkg.tar.zst | grep -E '/usr/(bin|share)/'
          desktop-file-validate /home/builder/pkg/pkg/"$PKG"/usr/share/applications/"$DESKTOP_FILE"
          mkdir -p "$GITHUB_WORKSPACE/_arch"
          cp /home/builder/pkg/{PKGBUILD,.SRCINFO,"$DESKTOP_FILE"} /home/builder/pkg/"$PKG"-*.pkg.tar.zst "$GITHUB_WORKSPACE/_arch/"
      # A fresh database holding just this version: each release carries its own, and pacman reads
      # the newest one through latest/download.
      - name: Build the repository database
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir _arch/repo
          cp _arch/"$PKG"-*.pkg.tar.zst _arch/repo/
          cd _arch/repo
          repo-add "$PACMAN_REPO.db.tar.zst" "$PKG"-*.pkg.tar.zst
          # repo-add links $PACMAN_REPO.db -> .db.tar.zst; release assets can't be links.
          for f in db files; do
            rm "$PACMAN_REPO.$f"
            cp "$PACMAN_REPO.$f.tar.zst" "$PACMAN_REPO.$f"
          done
          # Read it back the way pacman will.
          mkdir -p ../check/sync
          cp "$PACMAN_REPO.db" ../check/sync/
          printf '[options]\nArchitecture = auto\n[%s]\nSigLevel = Optional TrustAll\nServer = file:///nonexistent\n' "$PACMAN_REPO" > ../check/pacman.conf
          pacman --config ../check/pacman.conf --dbpath ../check -Si "$PKG" | tee ../check/si.txt
          grep -Eq "^Version +: $VERSION-1\$" ../check/si.txt \
            || { echo "::error::the $PACMAN_REPO database doesn't list $PKG $VERSION-1"; exit 1; }
          rm -r ../check
          ls -l
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: _arch/
          include-hidden-files: true
          if-no-files-found: error

  repo:
    name: Attach the pacman repository
    needs: build
    if: inputs.push_repo == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: _arch
      - name: Attach to the draft
        run: |
          set -euo pipefail
          [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" == "true" ]] \
            || { echo "::error::$TAG was published before the pacman repository was attached"; exit 1; }
          cd _arch/repo
          pkg="$(basename "$PKG"-*.pkg.tar.zst)"
          # Grace period: the previous release's package, outside the database. A pacman -Syu that
          # read that release's database just before this one was published still finds the package
          # it names under latest/download.
          extra=()
          prev="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)"
          if [[ -n "$prev" && "$prev" != "$TAG" ]]; then
            if gh release download "$prev" -p "$PKG-${prev#v}-*.pkg.tar.zst" -D ../prev 2>/dev/null; then
              extra=(../prev/*.pkg.tar.zst)
              echo "Also attaching $(basename "${extra[0]}") from $prev"
            else
              echo "::notice::$prev has no $PKG package to carry over"
            fi
          fi
          # The packages first, so the database never names a file that isn't there yet.
          gh release upload "$TAG" "$pkg" "${extra[@]}" --clobber
          gh release upload "$TAG" \
            "$PACMAN_REPO.db" "$PACMAN_REPO.db.tar.zst" "$PACMAN_REPO.files" "$PACMAN_REPO.files.tar.zst" --clobber
          echo "Attached $pkg and the $PACMAN_REPO pacman repository to $TAG" >> "$GITHUB_STEP_SUMMARY"

  aur:
    name: Push to the AUR
    needs: build
    if: inputs.push_aur == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: _arch
      - name: Push
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$AUR_SSH_PRIVATE_KEY" ]] || { echo "::error::AUR_SSH_PRIVATE_KEY is not set"; exit 1; }
          install -dm700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # Pinned: SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4, as the Arch wiki's AUR page lists it.
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/aur -o IdentitiesOnly=yes'
          git clone "ssh://aur@aur.archlinux.org/$PKG.git" aur
          cp _arch/{PKGBUILD,.SRCINFO,"$DESKTOP_FILE"} aur/
          cd aur
          git add PKGBUILD .SRCINFO "$DESKTOP_FILE"
          if git diff --cached --quiet; then
            echo "The AUR already has $PKG $VERSION" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name='Yuri Schimke' -c user.email='yuri@schimke.ee' commit -m "Update to $VERSION"
          git push origin HEAD:master
          echo "Pushed $PKG $VERSION to https://aur.archlinux.org/packages/$PKG" >> "$GITHUB_STEP_SUMMARY"

name: Design Artifacts

# Render the MeshCore design catalog and publish its importable bundle to a clean
# `design-artifacts/meshcore-mobile` branch, which the public preview server
# (preview.coo.ee) serves at /meshcore-mobile/.
#
# The common render → validate → generate → publish is delegated to the shared
# reusable workflow in compose-ai-tools; MeshCore only keeps its two bespoke
# lanes, which the reusable workflow exposes as generic hooks:
#   - the CJK fallback fonts are staged before the desktop render via
#     `stage-font-globs`;
#   - the "Material 3" tab (compose-m3 re-themed under MeshCore's palette) is
#     built in the `retheme` job below, uploaded as an artifact, and folded in by
#     the reusable workflow via `fold-*`.

on:
  # Weekly, so the published sticker sheet tracks the catalog as it evolves.
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  # Republish as soon as something that changes the rendered output lands on
  # main, instead of serving stale artifacts until Monday. The paths are the
  # render's inputs: the Gradle dependency manifests (they carry the
  # composePreviewPlugin pin that `cli-version: catalog` below resolves the
  # CLI from — a compose-ai-tools release changes the renderer itself — and
  # every other dependency the catalog renders against), the compose-ai-tools
  # action pin in compose-preview.yml (bumped in the same grouped Renovate
  # PR), the spec that decides what's in the sheet, and this file itself.
  #
  # This fires for merges made with an app token — Renovate automerges its own
  # compose-ai-tools PRs (see renovate.json) and those DO raise `push`. It does
  # NOT fire for GITHUB_TOKEN merges, which is why scheduled-merge.yml still
  # dispatches this workflow explicitly after the PRs it merges.
  push:
    branches:
      - main
    paths:
      # Dependency manifests. The version catalog holds most pins, but
      # Renovate's gradle manager also rewrites coords declared inline in a
      # module build file, and its gradle-wrapper manager rewrites
      # gradle-wrapper.properties. Globbed rather than enumerating the modules
      # `:app` and `:meshcore-components` actually pull in: that list goes
      # stale the moment a module is added, and the failure mode of missing one
      # is a silently stale delivery branch, which is the exact bug this
      # trigger exists to fix. An over-trigger just costs one spare render.
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '**/build.gradle.kts'
      - 'catalog.spec.json'
      # Design references are published onto the delivery branch from these, so
      # they are inputs to the artifact exactly like catalog.spec.json is. Without
      # them here, editing a mapping or a committed mock leaves the server serving
      # the previous reference until the weekly cron or an unrelated change.
      - 'design-map.json'
      - 'design/**'
      - '.github/workflows/design-artifacts.yml'
      - '.github/workflows/compose-preview.yml'
  # No `allow_incomplete` input any more: the publish job now passes
  # `allow-incomplete: true` unconditionally, so the dispatch toggle would be a
  # control that does nothing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Bespoke lane: re-theme the published compose-m3 stickersheet under MeshCore's
  # palette (no source rebuild) and hand the re-themed bundle to the reusable
  # workflow as an artifact, which folds it in as the "Material 3" tab.
  # ───────────────────────────────────────────────────────────────────────────
  retheme:
    name: re-theme compose-m3
    if: ${{ github.repository == 'yschimke/meshcore-mobile' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # JDK 21 + Gradle (to build the compose-preview CLI from source below).
      - uses: ./.github/actions/setup

      # The re-theme drives the desktop (Skiko/CPU) render daemon, which links
      # libGL — install Mesa's software GL + a font stack.
      - name: Install desktop (Skiko) render deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libfreetype6 libfontconfig1 fontconfig

      # `bundle render --res/--svg` + `bundle repack` are on compose-ai-tools@main
      # but not in a released CLI yet, so build the CLI from source.
      - name: Check out compose-ai-tools
        uses: actions/checkout@v7.0.1
        with:
          repository: yschimke/compose-ai-tools
          ref: main
          path: compose-ai-tools
          persist-credentials: false
      - name: Build compose-preview CLI from source (for the re-theme)
        working-directory: compose-ai-tools
        run: ./gradlew :cli:installDist --no-daemon

      # Fetch the published compose-m3 bundle + its content-addressed font pool
      # from the compose-m3 delivery branch (public repo, no auth). Shallow.
      - name: Fetch the published compose-m3 bundle + font pool
        run: |
          set -euo pipefail
          git clone --depth 1 --branch design-artifacts/compose-m3 \
            https://github.com/yschimke/compose-ai-tools.git compose-m3-artifacts
          test -f compose-m3-artifacts/bundle/compose-m3-bundle.png
          test -d compose-m3-artifacts/bundle/res

      - name: Re-theme compose-m3 under the MeshCore palette
        env:
          # Force Mesa's software GL for the desktop Skiko render (no GPU on the runner).
          LIBGL_ALWAYS_SOFTWARE: '1'
          # Embed the measured face (Roboto Flex) into the re-themed figma-svg
          # exports (fetched from Google Fonts with bounded retries; degrades to a
          # font-family reference if unreachable — never fails the render).
          JAVA_TOOL_OPTIONS: -Dcomposeai.figma.embedFonts=true
        run: |
          set -euo pipefail
          CLI="$GITHUB_WORKSPACE/compose-ai-tools/cli/build/install/compose-preview/bin/compose-preview"
          BLOB="$(jq -r .themeColors design/meshcore-theme-colors.json)"
          SRC=compose-m3-artifacts/bundle/compose-m3-bundle.png
          OUT="$GITHUB_WORKSPACE/compose-m3-rethemed"
          RENDERLOG="$RUNNER_TEMP/retheme-render.log"
          render_rc=0
          # Re-theme every published preview to PNG + editable figma-svg, rehydrating
          # the externalized fonts from the branch's pool. Under xvfb so the desktop
          # daemon has a display.
          #
          # The color/type/shape "catalog" previews (Palette colours / Typeface type
          # styles / Shape shapes) are metadata sheets the daemon can't resolve on the
          # --knob path — the catalog exporter excludes them too — so `bundle render`
          # reports them as failures and exits non-zero. Don't let that fail the job:
          # a preview that won't re-theme costs that one sticker, and blocking on it
          # strands the entire catalog. Every failure is surfaced as a warning and in
          # the job summary instead; only a total absence of renders is fatal, since
          # `bundle repack` then has nothing to swap in. (The absolute floor this
          # replaced held the delivery branch stale from 2026-08-18: upstream
          # compose-m3 shrank to 55 previews, of which these three always fail, so
          # a healthy 52 could never clear it.)
          #
          # theme.fonts brands the M3 type scale to match MeshcoreBrandedTypography
          # (Orbitron for display/headline/title, Space Grotesk for body/label), so
          # the re-themed "Material 3" tab + the theme-meshcore-dark foundation sticker
          # render in the MeshCore faces instead of Roboto. Families resolve against the
          # compose-m3 catalog's vendored Orbitron / Space Grotesk faces. (The knob is
          # per role group, so the title group is one face; MeshcoreBrandedTypography
          # splits titleLarge=Orbitron vs titleMedium/Small=Space Grotesk — Orbitron
          # matches the prominent titleLarge.)
          xvfb-run -a -s "-screen 0 2000x1400x24" \
            "$CLI" bundle render "$SRC" \
              --knob "theme.colors=$BLOB" \
              --knob "theme.fonts=families:display=Orbitron,headline=Orbitron,title=Orbitron,body=Space Grotesk,label=Space Grotesk" \
              --res compose-m3-artifacts/bundle/res \
              --svg \
              -o "$OUT" 2>&1 | tee "$RENDERLOG" \
            || render_rc=$?
          echo "bundle render exited $render_rc"
          count=$(find "$OUT" -maxdepth 1 -name '*.png' 2>/dev/null | wc -l)
          svgcount=$(find "$OUT" -maxdepth 1 -name '*.svg' 2>/dev/null | wc -l)
          echo "re-themed $count preview PNG(s), $svgcount figma-svg(s)"
          {
            echo "### compose-m3 re-theme"
            echo
            echo "Re-themed **$count** preview PNG(s) and **$svgcount** figma-svg(s); renderer exited \`$render_rc\`."
          } >> "$GITHUB_STEP_SUMMARY"
          # A non-zero exit with no per-preview FAIL line is the renderer itself
          # going down (daemon crash, bad input) rather than a preview refusing to
          # theme. Without this the exit status is swallowed, a partial $OUT clears
          # the count-is-zero guard, and the FAIL grep below finds nothing — so a
          # half-re-themed bundle would publish reporting no problem at all.
          if [ "$render_rc" -ne 0 ] && ! grep -qE '^[[:space:]]*FAIL' "$RENDERLOG"; then
            echo "::warning::bundle render exited $render_rc without reporting any per-preview FAIL — the renderer itself failed; $count preview(s) were re-themed and the rest keep the bundle's original stickers"
            {
              echo
              echo "> **Warning** — the renderer exited \`$render_rc\` without naming a failing"
              echo "> preview, so it went down mid-run rather than skipping a sticker."
              echo "> $count of the bundle's previews were re-themed; the remainder keep their"
              echo "> original (stock Material-colour) renders. See the step log for the tail."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # Surface every preview that would not re-theme — one warning each, plus
          # the verbatim list in the job summary — and carry on with what rendered.
          if grep -qE '^[[:space:]]*FAIL' "$RENDERLOG"; then
            failed=$(grep -cE '^[[:space:]]*FAIL' "$RENDERLOG")
            echo "::warning::$failed preview(s) failed to re-theme — see the job summary"
            {
              echo
              echo "<details><summary>$failed preview(s) failed to re-theme</summary>"
              echo
              echo '```'
              grep -E '^[[:space:]]*FAIL' "$RENDERLOG"
              echo '```'
              echo
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E '^[[:space:]]*FAIL' "$RENDERLOG" \
              | sed -E 's/^[[:space:]]*FAIL[[:space:]]+/::warning::could not re-theme /'
          fi
          # Every re-themed PNG should carry a matching re-themed figma-svg; where it
          # doesn't, `bundle repack` leaves the bundle's original (stock Material-colour)
          # previews/<id>.figma.svg beside a MeshCore-teal PNG. Warn rather than block —
          # a stale vector on some stickers beats no publish at all.
          if [ "$svgcount" -lt "$count" ]; then
            echo "::warning::only $svgcount re-themed figma-svg(s) for $count PNG(s) — the vector export fell short; those stickers keep the bundle's original figma.svg"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> **Warning** — only $svgcount figma-svg(s) for $count PNG(s); the shortfall keeps the original (stock Material-colour) vectors." >> "$GITHUB_STEP_SUMMARY"
          fi
          # The one fatal case: with nothing re-themed there is no bundle to repack
          # and no artifact for the publish job's fold to consume.
          if [ "$count" -eq 0 ]; then
            echo "::error::no previews re-themed at all — nothing to repack"
            exit 1
          fi
          # Swap the re-themed PNG + figma-svg back into the bundle → a drop-in
          # re-themed bundle the catalog exporter consumes like the original.
          "$CLI" bundle repack "$SRC" \
            --renders "$OUT" \
            -o "$GITHUB_WORKSPACE/compose-m3-meshcore.png"

      - name: Upload the re-themed bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: compose-m3-meshcore
          path: ${{ github.workspace }}/compose-m3-meshcore.png
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # Common lane: render every preview-enabled module — :app (Android),
  # :meshcore-components (CMP desktop) and :wear — validate the spec, generate,
  # fold in the re-themed compose-m3 as a "Material 3" tab, and publish to
  # design-artifacts/meshcore-mobile — all in the shared reusable workflow.
  # ───────────────────────────────────────────────────────────────────────────
  publish:
    name: meshcore-mobile
    needs: retheme
    if: ${{ github.repository == 'yschimke/meshcore-mobile' }}
    permissions:
      contents: write
    uses: yschimke/compose-ai-tools/.github/workflows/design-artifacts-reusable.yml@main
    with:
      system: meshcore-mobile
      spec: catalog.spec.json
      # Publish every preview-enabled module rather than `:app` plus one named
      # supplement. `:wear` also applies the preview plugin and its previews were
      # simply never published; repository-wide discovery picks it up alongside
      # `:app` and `:meshcore-components`. `extra-module` is rejected outright in
      # this mode ("redundant with repository-wide discovery"), and so is
      # `extra-split-mode` — discovery already gives every non-primary module its
      # own namespaced bundle, split per preview with its re-render classpath, which
      # is what `extra-split-mode: full` was buying for :meshcore-components.
      # `:app` stays the primary: catalog.spec.json's `"module": "app"` is passed to
      # discovery as the preferred module, so the authored entries still resolve
      # there and equal function names keep their historical winner.
      modules: all
      cli-version: catalog
      catalog-key: composePreviewPlugin
      commit-user-name: Yuri Schimke
      commit-user-email: yuri@schimke.ee
      timeout-minutes: 90
      # Stage the app's bundled faces so both halves of the parity lane resolve the
      # same glyphs. The Noto subsets are for the :meshcore-components desktop render
      # (CJK/Arabic from the bundled face rather than a system fallback).
      #
      # The branded faces are for the OTHER half. `Publish design references` runs in
      # this same job, after this staging step, and rasterises design/*.html with
      # Playwright — so it sees exactly what fontconfig holds here. Without Orbitron
      # staged, every mock whose stack starts `"Orbitron", "Space Grotesk", …` (the
      # top-bar titles) silently fell back, and the published reference disagreed with
      # the app about a typeface the app was rendering correctly. The comparison lane
      # then scored that as drift: Device/Populated lost ~3 points to it alone.
      stage-font-globs: >-
        meshcore-components/src/desktopMain/resources/fonts/*.ttf
        meshcore-components/src/desktopMain/resources/fonts/noto/*.ttf
      # Carry one executable bundle per discovered module so preview.coo.ee can still
      # re-render live without publishing another executable bundle for every preview.
      publish-live-bundle: true
      # Pure editable SVGs are a daemon data product too. Keep them transient through catalog
      # generation and per-preview cover cropping, then produce/cache them only when requested;
      # raster-backed hybrid SVGs remain static so their crop references stay self-contained.
      # This also avoids rewriting hundreds of coordinate-derived SVG files when an otherwise
      # identical render is packed in a slightly different order (ported from m3-catalog #249).
      defer-figma-svg: true
      # The per-preview split is the bulk of the current delivery branch: every publish writes
      # addressable copies under bundle/previews and bundle/modules. The module bundles above are
      # sufficient for the trusted serve host, so avoid multiplying the artifact by preview count.
      split-per-preview: false
      # Fold the re-themed compose-m3 bundle (from the retheme job) in as a tab.
      fold-artifact: compose-m3-meshcore
      fold-bundle: compose-m3-meshcore.png
      fold-spec: compose-ai-tools/samples/design-catalog-m3/catalog.spec.json
      fold-section: Material 3
      # The renders that legitimately carry no semantics tree — the synthetic Activity
      # heroes repository-wide discovery sweeps in, and the RemotePreviewWrapper widget
      # previews, which draw a RemoteDocument through a player View — are exempted BY
      # NAME in catalog.spec.json (`completeness.exemptSemantics`); see
      # yschimke/compose-ai-tools#4117.
      #
      # `allow-incomplete` is on unconditionally so anything the exemptions don't
      # anticipate is REPORTED rather than fatal. Refusing to publish over a preview
      # that failed to render is what stranded this catalog: the eight widget previews
      # lost their semantics, the gate blocked, and preview.coo.ee served a bundle from
      # before the Remote Compose snapshot switch until its live lane hit a
      # NoSuchMethodError. A catalog missing a sticker still beats a stale one; the
      # gaps come back as warnings in the run log and job summary.
      allow-incomplete: true
    secrets:
      buildfetch_ro_token: ${{ secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      # Lets the reusable workflow publish the `figma:` entries in design-map.json
      # as design references on the delivery branch, so the preview server's
      # PNG ↔ Design reference lane covers the light variants and not just the
      # committed HTML dark mocks. Same read-only token design-parity.yml uses;
      # without it those five entries are skipped with a warning and the rest of
      # the manifest still publishes.
      #
      # Safe only because compose-ai-tools#3203 has landed: this caller pins the
      # reusable workflow at `@main`, and GitHub rejects a named secret the called
      # workflow's `on.workflow_call.secrets` doesn't declare — the run fails to
      # parse before the job starts. Keep that ordering in mind if the pin ever
      # moves to a ref without the declaration.
      figma_token: ${{ secrets.FIGMA_TOKEN }}

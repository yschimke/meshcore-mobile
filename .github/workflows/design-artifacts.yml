name: Design Artifacts

# Render the MeshCore design catalog and publish its importable bundle to a clean
# `design-artifacts/meshcore-mobile` branch, which the public preview server
# (preview.coo.ee) serves at /meshcore-mobile/. That branch lives in the public
# output repository yschimke/meshcore-mobile-out (`artifact-repository` below),
# not in this repository, so generated history doesn't bloat source clones.
#
# The common render → validate → generate → publish is delegated to the shared
# reusable workflow in compose-ai-tools; MeshCore only keeps its two bespoke
# lane, which the reusable workflow exposes as a generic hook: the CJK fallback
# fonts are staged before the desktop render via `stage-font-globs`.
#
# MeshCore's theme tab comes from its own `@ThemeCatalog` / `@WearThemeCatalog`
# providers (MeshcoreThemeCatalogs.kt), rendered in this build against MeshCore's
# real MaterialTheme. There used to be a second "Material 3" tab: compose-ai-tools'
# pre-rendered compose-m3 bundle re-coloured with a palette scraped from source.
# It never ran MeshCore's theme, type, shapes or material3 version, so it showed
# what MeshCore might look like rather than what it renders, and it is gone.

on:
  # Weekly, so the published sticker sheet tracks the catalog as it evolves.
  schedule:
    - cron: '20 2 * * 3' # Wednesdays 02:20 UTC — weekly, at a quiet time, off the top of the hour
  # Republish as soon as something that changes the rendered output lands on
  # main, instead of serving stale artifacts until Wednesday. The paths are the
  # render's inputs: the Gradle dependency manifests (they carry the
  # composePreviewPlugin pin that `cli-version: catalog` below resolves the
  # CLI from — a compose-ai-tools release changes the renderer itself — and
  # every other dependency the catalog renders against), the compose-ai-tools
  # action pin in compose-preview.yml (bumped in the same grouped Renovate
  # PR), the spec that decides what's in the sheet, and this file itself.
  #
  # This fires for merges made with an app token — Renovate automerges its own
  # compose-ai-tools PRs (see renovate.json) and those DO raise `push`. It does
  # NOT fire for GITHUB_TOKEN merges, which is why scheduled-merge.yml still
  # dispatches this workflow explicitly after the PRs it merges.
  push:
    branches:
      - main
    paths:
      # Dependency manifests. The version catalog holds most pins, but
      # Renovate's gradle manager also rewrites coords declared inline in a
      # module build file, and its gradle-wrapper manager rewrites
      # gradle-wrapper.properties. Globbed rather than enumerating the modules
      # `:app` and `:meshcore-components` actually pull in: that list goes
      # stale the moment a module is added, and the failure mode of missing one
      # is a silently stale delivery branch, which is the exact bug this
      # trigger exists to fix. An over-trigger just costs one spare render.
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '**/build.gradle.kts'
      - 'catalog.spec.json'
      - 'adaptive-uid-pilot/**'
      - 'build-logic/**'
      - '.github/workflows/adaptive-uid-*.yml'
      # Design references are published onto the delivery branch from these, so
      # they are inputs to the artifact exactly like catalog.spec.json is. Without
      # them here, editing a mapping or a committed mock leaves the server serving
      # the previous reference until the weekly cron or an unrelated change.
      - 'design-map.json'
      - 'design/**'
      - 'meshcore-components/**'
      - 'meshcore-core/**'
      - 'ui-builder-catalog/**'
      - 'ui-builder-catalog-renderer/**'
      - '.github/workflows/design-artifacts.yml'
      - '.github/workflows/compose-preview.yml'
  # No `allow_incomplete` input any more: the publish job now passes
  # `allow-incomplete: true` unconditionally, so the dispatch toggle would be a
  # control that does nothing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  uid-references:
    uses: ./.github/workflows/adaptive-uid-pilot.yml

  # ───────────────────────────────────────────────────────────────────────────
  # Common lane: render every preview-enabled module — :app (Android),
  # :meshcore-components (CMP desktop) and :wear — validate the spec, generate,
  # and publish to design-artifacts/meshcore-mobile in yschimke/meshcore-mobile-out
  # — all in the shared reusable workflow.
  # ───────────────────────────────────────────────────────────────────────────
  publish:
    needs: uid-references
    name: meshcore-mobile
    if: ${{ github.repository == 'yschimke/meshcore-mobile' }}
    permissions:
      contents: write
    uses: yschimke/compose-ai-tools/.github/workflows/design-artifacts-reusable.yml@v2.66.0
    with:
      system: meshcore-mobile
      ui-builder-catalog-task: ':ui-builder-catalog:exportTypedCatalog'
      ui-builder-catalog-dir: ui-builder-catalog/build/catalog
      ui-builder-runtime-task: ':ui-builder-catalog-renderer:rendererArchive'
      ui-builder-runtime-archive: ui-builder-catalog-renderer/build/ui-builder-runtime.zip
      ui-builder-runtime-source-ref: v3.111.0
      ref: ${{ github.sha }}
      # Generated branches go to the public output repository. Only the reusable
      # workflow's isolated publish job (which runs no project Gradle) receives
      # artifacts_token; render jobs read the -out branches anonymously, which is
      # why that repository must stay public. The source marker
      # refs/design-artifacts/source/meshcore-mobile stays here (it names a source
      # commit), which is why this job keeps `contents: write`.
      artifact-repository: yschimke/meshcore-mobile-out
      catalog-section-artifact: adaptive-uid-catalog
      catalog-section: Screens
      publish: ${{ github.ref == 'refs/heads/main' }}
      upload-out: true
      spec: catalog.spec.json
      # Publish every preview-enabled module rather than `:app` plus one named
      # supplement. `:wear` also applies the preview plugin and its previews were
      # simply never published; repository-wide discovery picks it up alongside
      # `:app` and `:meshcore-components`. `extra-module` is rejected outright in
      # this mode ("redundant with repository-wide discovery"), and so is
      # `extra-split-mode` — discovery already gives every non-primary module its
      # own namespaced bundle, split per preview with its re-render classpath, which
      # is what `extra-split-mode: full` was buying for :meshcore-components.
      # `:app` stays the primary: catalog.spec.json's `"module": "app"` is passed to
      # discovery as the preferred module, so the authored entries still resolve
      # there and equal function names keep their historical winner.
      modules: all
      cli-version: catalog
      catalog-key: composePreviewPlugin
      commit-user-name: Yuri Schimke
      commit-user-email: yuri@schimke.ee
      timeout-minutes: 90
      # Stage the app's bundled faces so both halves of the parity lane resolve the
      # same glyphs. The Noto subsets are for the :meshcore-components desktop render
      # (CJK/Arabic from the bundled face rather than a system fallback).
      #
      # The branded faces are for the OTHER half. `Publish design references` runs in
      # this same job, after this staging step, and rasterises design/*.html with
      # Playwright — so it sees exactly what fontconfig holds here. Without Orbitron
      # staged, every mock whose stack starts `"Orbitron", "Space Grotesk", …` (the
      # top-bar titles) silently fell back, and the published reference disagreed with
      # the app about a typeface the app was rendering correctly. The comparison lane
      # then scored that as drift: Device/Populated lost ~3 points to it alone.
      stage-font-globs: >-
        meshcore-components/src/desktopMain/resources/fonts/*.ttf
        meshcore-components/src/desktopMain/resources/fonts/noto/*.ttf
      # Carry one executable bundle per discovered module so preview.coo.ee can still
      # re-render live without publishing another executable bundle for every preview.
      publish-live-bundle: true
      # Pure editable SVGs are a daemon data product too. Keep them transient through catalog
      # generation and per-preview cover cropping, then produce/cache them only when requested;
      # raster-backed hybrid SVGs remain static so their crop references stay self-contained.
      # This also avoids rewriting hundreds of coordinate-derived SVG files when an otherwise
      # identical render is packed in a slightly different order (ported from m3-catalog #249).
      defer-figma-svg: true
      # The per-preview split is the bulk of the current delivery branch: every publish writes
      # addressable copies under bundle/previews and bundle/modules. The module bundles above are
      # sufficient for the trusted serve host, so avoid multiplying the artifact by preview count.
      split-per-preview: false
      # The renders that legitimately carry no semantics tree — the synthetic Activity
      # heroes repository-wide discovery sweeps in, and the RemotePreviewWrapper widget
      # previews, which draw a RemoteDocument through a player View — are exempted BY
      # NAME in catalog.spec.json (`completeness.exemptSemantics`); see
      # yschimke/compose-ai-tools#4117.
      #
      # `allow-incomplete` is on unconditionally so anything the exemptions don't
      # anticipate is REPORTED rather than fatal. Refusing to publish over a preview
      # that failed to render is what stranded this catalog: the eight widget previews
      # lost their semantics, the gate blocked, and preview.coo.ee served a bundle from
      # before the Remote Compose snapshot switch until its live lane hit a
      # NoSuchMethodError. A catalog missing a sticker still beats a stale one; the
      # gaps come back as warnings in the run log and job summary.
      allow-incomplete: true
    secrets:
      # Contents write on yschimke/meshcore-mobile-out only (see artifact-repository).
      artifacts_token: ${{ secrets.ARTIFACTS_TOKEN }}
      buildfetch_ro_token: ${{ secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      # Lets the reusable workflow publish the `figma:` entries in design-map.json
      # as design references on the delivery branch, so the preview server's
      # PNG ↔ Design reference lane covers the light variants and not just the
      # committed HTML dark mocks. Same read-only token design-parity.yml uses;
      # without it those five entries are skipped with a warning and the rest of
      # the manifest still publishes.
      #
      # Safe only because compose-ai-tools#3203 has landed: this caller pins the
      # reusable workflow at `@main`, and GitHub rejects a named secret the called
      # workflow's `on.workflow_call.secrets` doesn't declare — the run fails to
      # parse before the job starts. Keep that ordering in mind if the pin ever
      # moves to a ref without the declaration.
      figma_token: ${{ secrets.FIGMA_TOKEN }}

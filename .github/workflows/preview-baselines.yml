name: Preview Baselines

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-baselines
  cancel-in-progress: false

jobs:
  update:
    name: Update compose-preview/main baselines
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - uses: yschimke/compose-ai-tools/.github/actions/preview-baselines@v0.11.0
        with:
          cli-version: catalog
          catalog-key: composePreview

name: ktfmt

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ktfmt-check:
    name: ktfmtCheck
    runs-on: ubuntu-latest
    env:
      # Read-only BuildFetch remote cache (see settings.gradle.kts): pull task
      # outputs instead of building cold. ON_CI is unset, so this stays a reader
      # — ci.yml remains the sole cache writer.
      BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN: ${{ secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: ./.github/actions/setup

      - name: Run ktfmtCheck
        run: ./gradlew ktfmtCheck --stacktrace

name: 'Setup JDK + Gradle'
description: 'Common bootstrap: Temurin JDK + Gradle wrapper.'
inputs:
  cache-read-only:
    description: >
      Pass 'true' in publish/release jobs to prevent Gradle cache
      writes — avoids cache poisoning from untrusted PR runs.
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Use the preinstalled Apple Silicon JDK
      if: runner.os == 'macOS' && runner.arch == 'ARM64'
      shell: bash
      run: |
        "${JAVA_HOME_21_arm64:?}/bin/java" -version
        echo "JAVA_HOME=$JAVA_HOME_21_arm64" >> "$GITHUB_ENV"
        echo "$JAVA_HOME_21_arm64/bin" >> "$GITHUB_PATH"
    - uses: actions/setup-java@v6.2.0
      if: runner.os != 'macOS' || runner.arch != 'ARM64'
      with:
        distribution: temurin
        # Match the runner's cached JDK 21 instead of forcing an exact release-asset download.
        java-version: '21'
    # CI supplies tokens through the environment, matching settings.gradle.kts.
    - id: cache-mode
      shell: bash
      run: echo "remote-push-enabled=$(bash scripts/cache-mode.sh)" >> "$GITHUB_OUTPUT"
    - uses: gradle/actions/setup-gradle@v6.4.1
      with:
        cache-read-only: ${{ inputs.cache-read-only }}
        gradle-home-cache-excludes: ${{ steps.cache-mode.outputs.remote-push-enabled == 'true' && 'caches/build-cache-1' || '' }}
    - name: Prepare Gradle distribution
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: python scripts/prepare-gradle.py
    - uses: ./.github/actions/android-sdk

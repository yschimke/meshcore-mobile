name: 'Setup JDK + Gradle'
description: 'Common bootstrap: Temurin JDK + Gradle wrapper.'
inputs:
  cache-read-only:
    description: >
      Pass 'true' in publish/release jobs to prevent Gradle cache
      writes — avoids cache poisoning from untrusted PR runs.
    default: 'false'
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-java@v6.1.0
      with:
        distribution: temurin
        java-version: '21.0.12+101.0.LTS'
    # CI supplies tokens through the environment, matching settings.gradle.kts.
    - id: cache-mode
      shell: bash
      run: echo "remote-push-enabled=$(bash scripts/cache-mode.sh)" >> "$GITHUB_OUTPUT"
    - uses: gradle/actions/setup-gradle@v6.4.0
      with:
        cache-read-only: ${{ inputs.cache-read-only }}
        gradle-home-cache-excludes: ${{ steps.cache-mode.outputs.remote-push-enabled == 'true' && 'caches/build-cache-1' || '' }}
    - uses: ./.github/actions/android-sdk

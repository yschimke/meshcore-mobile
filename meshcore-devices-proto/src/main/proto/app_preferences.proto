syntax = "proto3";

package ee.schimke.meshcore.app.data.proto;

option java_package = "ee.schimke.meshcore.app.data.proto";

// Top-level DataStore record for app-wide UI preferences.
// Section states are per-device.
message AppPreferencesPb {
  // Formerly the user-selected theme mode / palette. The app now has a single theme that follows
  // the system light/dark setting; the numbers stay reserved so old files still decode.
  reserved 1, 2;
  reserved "theme_mode", "theme_palette";

  // Per-device section collapse states, keyed by device ID.
  map<string, DeviceSectionStatesPb> device_sections = 3;

  // Developer options, unlocked by tapping the version row in Settings 7 times.
  bool developer_mode = 4;
}

// Collapse states for the device-screen sections.
message DeviceSectionStatesPb {
  bool channels_expanded = 1;
  bool contacts_expanded = 2;
  bool rooms_expanded = 4;
  bool repeaters_expanded = 6;
  bool sensors_expanded = 8;

  // Formerly the per-section "show all" filter toggles; the sections now always list everything.
  reserved 3, 5, 7, 9;
  reserved "contacts_show_all", "rooms_show_all", "repeaters_show_all", "channels_show_all";
}

#Kotlin
kotlin.code.style=official
# Metro RC4's compiler plugin is compiled for Java 21. Keep Kotlin compiler plugin loading inside
# the Gradle daemon JVM selected by gradle/gradle-daemon-jvm.properties instead of a stale Java 17
# Kotlin daemon.
kotlin.compiler.execution.strategy=in-process

#Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

# Compose Multiplatform's tooling manifest contributes
# org.jetbrains.androidx.compose.ui.tooling.PreviewActivity. It is a tooling trampoline, not an
# app screen, but compose-ai-tools 1.62.0 only filters the androidx.* spelling during activity
# discovery. Keep its synthetic optional capture out of both :app and :wear until the discovery
# filter covers the relocated namespace too.
composePreview.idExclude=activity__PreviewActivity

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
